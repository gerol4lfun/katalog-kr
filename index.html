<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {

.mono{ font-family:var(--fm); font-feature-settings:"tnum" 1; }

.screens{ display:flex; flex-direction:column; align-items:center; gap:40px; padding:40px 0; }
.screen{ width:1080px; height:1920px; background:var(--surface); position:relative;

.stripe{ position:absolute; left:0; top:0; width:12px; height:100%; z-index:3; }
.p-pad{ padding:64px 72px; display:flex; flex-direction:column; height:100%; }

.p-head{ display:flex; align-items:center; justify-content:space-between;

.p-tag{ display:flex; align-items:center; gap:16px; }
.p-square{ width:30px; height:30px; }
.p-tag b{ font-family:var(--fb); font-weight:700; font-size:23px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink); }
.p-idx{ font-size:23px; color:var(--muted); }

.p-title{ font-family:var(--fh); font-size:82px; font-weight:700; line-height:1.02;

.p-title.small{ font-size:60px; margin-top:36px; }
.p-sub{ font-family:var(--fh); font-size:28px; color:var(--muted); margin-top:14px; }
.p-aud{ font-size:26px; line-height:1.4; color:var(--muted); margin-top:18px; max-width:900px; }
.p-differ{ font-size:24px; line-height:1.5; color:var(--muted); margin-top:14px; max-width:920px; }

.photo-slot{ position:relative; }
.ph{ background:#EDEFF2; border:1px solid var(--hair); display:flex; align-items:center;
  justify-content:center; text-align:center; box-sizing:border-box; }
.ph .lbl{ font-family:var(--fm); font-size:20px; color:#9AA1AB; line-height:1.5; }
.p-photo{ margin:28px auto 0; }
.p-thumbs{ display:flex; gap:18px; justify-content:center; margin-top:16px; }
.p-spacer{ flex:1; min-height:16px; }

.p-foot{ border-top:1px solid var(--hair); padding-top:34px; }
.cluster{ display:flex; align-items:center; gap:26px; }
.btn-call{ display:inline-flex; align-items:center; gap:16px; background:var(--primary);
  color:var(--onp); font-family:var(--fb); font-weight:700; font-size:30px; padding:26px 46px;
  border-radius:6px; text-decoration:none; }
.btn-call svg{ width:34px; height:34px; }
.msgrs{ display:flex; gap:16px; }
.msgr{ width:76px; height:76px; border:1.5px solid var(--hair); border-radius:6px;
  display:flex; align-items:center; justify-content:center; }
.msgr img{ width:38px; height:38px; object-fit:contain; }
.foot-row{ display:flex; align-items:center; justify-content:space-between; margin-top:22px; }
.phone-no{ font-family:var(--fm); font-size:24px; color:var(--muted); letter-spacing:.02em; }
.nav-up{ display:flex; align-items:center; gap:8px; color:var(--muted); font-size:18px;
  text-decoration:none; }
.nav-up svg{ width:18px; height:18px; }

table.data-table{ margin-top:22px; border-collapse:collapse; width:100%; }
table.data-table th{ text-align:left; font-family:var(--fb); font-size:16px; letter-spacing:.1em;

table.data-table th:last-child, table.data-table td.price{ text-align:right; }

table.data-table td.price{ font-size:19px; white-space:nowrap; padding-left:14px; }

.kit-title{ font-family:var(--fb); font-size:17px; letter-spacing:.16em; text-transform:uppercase;

.two-col{ display:flex; gap:50px; margin-top:40px; }
.col{ flex:1; }
.col-title{ font-family:var(--fh); font-size:34px; font-weight:700; }

.series-label{ font-family:var(--fh); font-size:24px; font-weight:700; margin-top:20px; }
.series-blurb{ font-size:18px; line-height:1.35; color:var(--muted); margin-top:5px; max-width:900px; }
table.np-table{ margin-top:10px; }
table.np-table td{ padding:6px 4px; font-size:18px; }
table.np-table td:first-child{ width:70%; }

.groups-grid{ display:flex; gap:28px; margin-top:22px; }

.wall-grid{ display:flex; gap:56px; margin-top:34px; }

.wall-layer-label{ font-family:var(--fb); font-weight:700; font-size:19px; color:var(--ink); }

.wall-bottom{ margin-top:32px; padding-top:22px; border-top:1px solid var(--hair); font-size:19px; }

.assembly-steps{ margin-top:30px; display:flex; flex-direction:column; gap:22px; }
.assembly-step{ display:flex; gap:24px; align-items:flex-start; }

.assembly-title{ font-family:var(--fh); font-size:23px; font-weight:700; }
.assembly-text{ font-size:19px; line-height:1.45; color:var(--muted); margin-top:4px; max-width:820px; }

.docs-title{ font-family:var(--fh); font-size:26px; font-weight:700; }
.docs-text{ font-size:20px; line-height:1.45; color:var(--muted); margin-top:6px; max-width:860px; }

.faq-list{ margin-top:30px; display:flex; flex-direction:column; gap:26px; }

.final-center{ flex:1; display:flex; flex-direction:column; align-items:center;

.final-title{ font-family:var(--fh); font-size:60px; font-weight:700; max-width:820px; }

@media print {

  .screens{ padding:0; gap:0; }

function fmtPrice(n) { return n.toLocaleString('ru-RU') + ' ₽'; }
function esc(s) { return s; } // содержимое DATA доверенное (не пользовательский ввод)

// Слот фото: пробует реальный файл foto/<file>, если его нет — серая заглушка с именем.
// Работает и без пересборки: просто положите файл с этим именем в foto/.
function photoPh(file, w, h) {
  return `<div class="photo-slot" style="width:${w}px;height:${h}px">
    <img src="foto/${file}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="ph" style="width:100%;height:100%;display:none;position:absolute;top:0;left:0">
      <span class="lbl">${file}<br>${w} × ${h}</span>
    </div>
  </div>`;
}

function buttonCluster() {
  const L = DATA.links;
  return `<div class="cluster">
    <a class="btn-call" href="${DATA.brand.phoneTel}">${ICON_PHONE}<span>Позвонить</span></a>
    <div class="msgrs">
      <a class="msgr" href="${L.whatsapp}" target="_blank" rel="noopener"><img src="foto/icons/whatsapp.svg" alt="WhatsApp"></a>
      <a class="msgr" href="${L.telegram}" target="_blank" rel="noopener"><img src="foto/icons/telegram.svg" alt="Telegram"></a>
      <a class="msgr" href="${L.max}" target="_blank" rel="noopener"><img src="foto/icons/max.png" alt="Max"></a>
    </div>
  </div>`;
}

function footerBlock() {
  return `<div class="p-foot">
    ${buttonCluster()}
    <div class="foot-row">
      <span class="phone-no">${DATA.brand.phoneText} · ${DATA.brand.hours}</span>
      <a class="nav-up" href="#navigator">${ICON_UP}<span>к навигатору</span></a>
    </div>
  </div>`;
}

// accentKey=null -> нейтральная шапка входных экранов (бренд, без цветной метки раздела)
function headerBlock(accentKey, famNum) {
  if (!accentKey) {
    return `<div class="p-head">
      <div class="p-tag"><b>КОНСТРУКТИВНЫЕ РЕШЕНИЯ</b></div>
    </div>`;
  }
  const [color, label] = DATA.accents[accentKey];
  const idx = famNum ? `<div class="p-idx mono">${String(famNum).padStart(2,'0')} / ${DATA.totalFamilies}</div>` : '';
  return `<div class="p-head">
    <div class="p-tag"><span class="p-square" style="background:${color}"></span><b>${label}</b></div>
    ${idx}
  </div>`;
}

function renderTable(rows) {
  let t = '<table class="data-table"><thead><tr><th>Модель</th><th>Размер</th><th>Особенности</th><th>Цена</th></tr></thead><tbody>';
  for (const [name, size, feat, price] of rows) {
    t += `<tr><td>${name}</td><td>${size}</td><td>${feat}</td><td class="mono price">${fmtPrice(price)}</td></tr>`;
  }
  return t + '</tbody></table>';
}

function renderNamePriceTable(rows) {
  let t = '<table class="data-table np-table"><tbody>';
  for (const [name, price] of rows) {
    t += `<tr><td>${name}</td><td class="mono price">${fmtPrice(price)}</td></tr>`;
  }
  return t + '</tbody></table>';
}

function familyVisual(fam) {
  const [color] = DATA.accents[fam.accent];
  const s = fam.slug;
  let html = `<section class="screen" id="fam-${fam.num}-visual"><div class="stripe" style="background:${color}"></div><div class="p-pad">`;
  html += headerBlock(fam.accent, fam.num);
  html += `<div class="p-title">${fam.name}</div>`;
  html += `<div class="p-aud">Кому подходит: ${fam.audience}</div>`;
  html += `<div class="p-photo">${photoPh(`${s}-main.jpg`, 936, 702)}</div>`;
  html += '<div class="p-thumbs">';
  for (const i of [1,2,3]) html += photoPh(`${s}-${i}.jpg`, 300, 300);
  html += '</div>';
  html += `<div class="p-differ">${fam.differ}</div>`;
  html += '<div class="p-spacer"></div>';
  html += footerBlock();
  html += '</div></section>';
  return html;
}

function familyData(fam) {
  const [color] = DATA.accents[fam.accent];
  let html = `<section class="screen" id="fam-${fam.num}-data"><div class="stripe" style="background:${color}"></div><div class="p-pad">`;
  html += headerBlock(fam.accent, fam.num);
  html += `<div class="p-title small">${fam.name}</div>`;
  html += '<div class="p-sub">Размеры и цены</div>';

  if (fam.seriesGroups) {
    for (const g of fam.seriesGroups) {
      html += `<div class="series-label">${g.label}</div><div class="series-blurb">${g.blurb}</div>`;
      html += renderNamePriceTable(g.models);
    }
    html += `<div class="dop-line">${fam.detailNote}</div>`;
  } else if (fam.groups) {
    html += `<div class="groups-grid cols-${fam.groups.length}">` + fam.groups.map(g =>
      `<div class="group-col"><div class="group-label">${g.label}</div>${renderNamePriceTable(g.models)}</div>`
    ).join('') + '</div>';
    html += '<div class="kit-title">Что входит в цену</div>';
    html += '<ul class="kit-list">' + fam.kit.map(k => `<li>${k}</li>`).join('') + '</ul>';
    html += `<div class="dop-line">${DATA.dopolnitelno}</div>`;
  } else {
    const models = fam.models;
    if (models.length > 10) {
      const mid = Math.ceil(models.length / 2);
      html += `<div class="data-table-split">${renderTable(models.slice(0,mid))}${renderTable(models.slice(mid))}</div>`;
    } else {
      html += renderTable(models);
    }
    html += '<div class="kit-title">Что входит в цену</div>';
    html += '<ul class="kit-list">' + fam.kit.map(k => `<li>${k}</li>`).join('') + '</ul>';
    html += `<div class="dop-line">${DATA.dopolnitelno}</div>`;
  }
  html += '<div class="p-spacer"></div>';
  html += footerBlock();
  html += '</div></section>';
  return html;
}

// Малые формы: одним экраном — заголовок, короткий контекст, таблица всех позиций
function familySingle(fam) {
  const [color] = DATA.accents[fam.accent];
  let html = `<section class="screen" id="fam-${fam.num}-visual"><div class="stripe" style="background:${color}"></div><div class="p-pad">`;
  html += headerBlock(fam.accent, fam.num);
  html += `<div class="p-title">${fam.name}</div>`;

  html += '<div class="p-spacer"></div>';

function buildAllScreens() {
  const parts = [];
  parts.push({id:'cover', html: screenCover()});
  parts.push({id:'tri-shaga', html: screenThreeSteps()});
  parts.push({id:'navigator', html: screenNavigator()});
  parts.push({id:'derevo-metall', html: screenWoodOrMetal()});
  parts.push({id:'my-dorozhe', html: screenWeArePricier()});
  const dividerIdx = {dacha: 0, bani: 1, stroyka: 2, san: 3, torg: 4, small: 5};
  const famsBySection = {dacha: [1,2,3,4,5], bani: [6], stroyka: [7,8,9,10,11,12], san: [13,14], torg: [15,16,17], small: [18]};
  const famByNum = {};
  for (const fam of DATA.families) famByNum[fam.num] = fam;
  for (const d of DATA.dividers) {
    parts.push({id:`razdel-${d.accent}`, html: dividerScreen(d)});
    for (const num of famsBySection[d.accent]) {
      const fam = famByNum[num];
      if (fam.singleScreen) {
        parts.push({id:`fam-${fam.num}-visual`, html: familySingle(fam)});
      } else {
        parts.push({id:`fam-${fam.num}-visual`, html: familyVisual(fam)});
        parts.push({id:`fam-${fam.num}-data`, html: familyData(fam)});
      }
    }
  }
  parts.push({id:'stena', html: screenWallLayers()});
  parts.push({id:'sborka', html: screenAssembly()});
  parts.push({id:'dostavka', html: screenDelivery()});
  parts.push({id:'poluchite', html: screenWhatYouGet()});
  parts.push({id:'pokupka', html: screenPurchase()});
  parts.push({id:'faq', html: screenFaq()});
  parts.push({id:'final', html: screenFinal()});
  return parts;
}

(function render() {
  let parts = buildAllScreens();
  const only = new URLSearchParams(location.search).get('only');
  if (only) parts = parts.filter(p => p.id === only);
  document.getElementById('screens').innerHTML = parts.map(p => p.html).join('');
})();

</script>
