const ICON_PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h3l1.5 4-2 1.4a11 11 0 0 0 5.1 5.1l1.4-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4 5.2 2 2 0 0 1 6 3Z"/></svg>';
const ICON_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';

function fmtPrice(n) { return n.toLocaleString('ru-RU') + ' ₽'; }
function esc(s) { return s; } // содержимое DATA доверенное (не пользовательский ввод)

function photoPh(label, w, h) {
  return `<div class="ph" style="width:${w}px;height:${h}px"><span class="lbl">${label}<br>${w} × ${h}</span></div>`;
}

function buttonCluster() {
  const L = DATA.links;
  return `<div class="cluster">
    <a class="btn-call" href="${DATA.brand.phoneTel}">${ICON_PHONE}<span>Позвонить</span></a>
    <div class="msgrs">
      <a class="msgr" href="${L.whatsapp}" target="_blank" rel="noopener"><img src="foto/icons/whatsapp.svg" alt="WhatsApp"></a>
      <a class="msgr" href="${L.telegram}" target="_blank" rel="noopener"><img src="foto/icons/telegram.svg" alt="Telegram"></a>
      <a class="msgr" href="${L.max}" target="_blank" rel="noopener"><img src="foto/icons/max.png" alt="Max"></a>
    </div>
  </div>`;
}

function footerBlock() {
  return `<div class="p-foot">
    ${buttonCluster()}
    <div class="foot-row">
      <span class="phone-no">${DATA.brand.phoneText} · ${DATA.brand.hours}</span>
      <a class="nav-up" href="#navigator">${ICON_UP}<span>к навигатору</span></a>
    </div>
  </div>`;
}

// accentKey=null -> нейтральная шапка входных экранов (бренд, без цветной метки раздела)
function headerBlock(accentKey, famNum) {
  if (!accentKey) {
    return `<div class="p-head">
      <div class="p-tag"><b>КОНСТРУКТИВНЫЕ РЕШЕНИЯ</b></div>
    </div>`;
  }
  const [color, label] = DATA.accents[accentKey];
  const idx = famNum ? `<div class="p-idx mono">${String(famNum).padStart(2,'0')} / ${DATA.totalFamilies}</div>` : '';
  return `<div class="p-head">
    <div class="p-tag"><span class="p-square" style="background:${color}"></span><b>${label}</b></div>
    ${idx}
  </div>`;
}

function renderTable(rows) {
  let t = '<table class="data-table"><thead><tr><th>Модель</th><th>Размер</th><th>Особенности</th><th>Цена</th></tr></thead><tbody>';
  for (const [name, size, feat, price] of rows) {
    t += `<tr><td>${name}</td><td>${size}</td><td>${feat}</td><td class="mono price">${fmtPrice(price)}</td></tr>`;
  }
  return t + '</tbody></table>';
}

function familyVisual(fam) {
  const [color] = DATA.accents[fam.accent];
  const s = fam.slug;
  let html = `<section class="screen" id="fam-${fam.num}-visual"><div class="stripe" style="background:${color}"></div><div class="p-pad">`;
  html += headerBlock(fam.accent, fam.num);
  html += `<div class="p-title">${fam.name}</div>`;
  html += `<div class="p-aud">Кому подходит: ${fam.audience}</div>`;
  html += `<div class="p-photo">${photoPh(`${s}-main.jpg`, 960, 820)}</div>`;
  html += '<div class="p-thumbs">';
  for (const i of [1,2,3]) html += photoPh(`${s}-${i}.jpg`, 320, 320);
  html += '</div>';
  html += `<div class="p-differ">${fam.differ}</div>`;
  html += '<div class="p-spacer"></div>';
  html += footerBlock();
  html += '</div></section>';
  return html;
}

function familyData(fam) {
  const [color] = DATA.accents[fam.accent];
  let html = `<section class="screen" id="fam-${fam.num}-data"><div class="stripe" style="background:${color}"></div><div class="p-pad">`;
  html += headerBlock(fam.accent, fam.num);
  html += `<div class="p-title small">${fam.name}</div>`;
  html += '<div class="p-sub">Размеры и цены</div>';
  const models = fam.models;
  if (models.length > 10) {
    const mid = Math.ceil(models.length / 2);
    html += `<div class="data-table-split">${renderTable(models.slice(0,mid))}${renderTable(models.slice(mid))}</div>`;
  } else {
    html += renderTable(models);
  }
  html += '<div class="kit-title">Что входит в цену</div>';
  html += '<ul class="kit-list">' + fam.kit.map(k => `<li>${k}</li>`).join('') + '</ul>';
  html += `<div class="dop-line">${DATA.dopolnitelno}</div>`;
  html += '<div class="p-spacer"></div>';
  html += footerBlock();
  html += '</div></section>';
  return html;
}

function dividerScreen(d) {
  const [color] = DATA.accents[d.accent];
  return `<section class="screen divider-screen" id="razdel-${d.accent}">
    <div class="divider-inner" style="background:${color}">
      <div class="divider-title">${d.title}</div>
      <div class="divider-tag">${d.tagline}</div>
    </div>
  </section>`;
}

function screenCover() {
  const c = DATA.cover;
  let html = '<section class="screen" id="cover"><div class="p-pad cover-pad">';
  html += `<div class="cover-kicker">${c.kicker}</div>`;
  html += `<div class="cover-title">${c.title}</div>`;
  html += `<div class="cover-sub">${c.sub}</div>`;
  html += photoPh(c.photo.file, c.photo.w, c.photo.h);
  html += `<div class="cover-stat mono">${c.stat}</div>`;
  html += '<div class="p-spacer"></div>';
  html += footerBlock();
  html += '</div></section>';
  return html;
}

function screenThreeSteps() {
  let html = '<section class="screen" id="tri-shaga"><div class="p-pad">';
  html += headerBlock(null);
  html += '<div class="p-title small">Как выбрать за три шага</div>';
  for (const [num, title, text] of DATA.steps) {
    html += `<div class="step-row"><div class="step-num mono">${num}</div>
      <div><div class="step-title">${title}</div><div class="step-text">${text}</div></div></div>`;
  }
  html += `<div class="step-note">${DATA.stepNote}</div>`;
  html += '<div class="p-spacer"></div>';
  html += footerBlock();
  html += '</div></section>';
  return html;
}

function screenNavigator() {
  let html = '<section class="screen" id="navigator"><div class="p-pad">';
  html += headerBlock(null);
  html += '<div class="p-title small">Навигатор</div>';
  html += '<div class="p-sub">Мне нужно… → откройте раздел</div>';
  html += '<table class="nav-table"><tbody>';
  for (const [need, famNum] of DATA.navRows) {
    html += `<tr><td>${need}</td><td><a href="#fam-${famNum}-visual">${DATA.famNames[famNum]} →</a></td></tr>`;
  }
  html += '</tbody></table>';
  html += '<div class="p-spacer"></div>';
  html += footerBlock();
  html += '</div></section>';
  return html;
}

function screenWoodOrMetal() {
  const wm = DATA.woodMetal;
  let html = '<section class="screen" id="derevo-metall"><div class="p-pad">';
  html += headerBlock(null);
  html += '<div class="p-title small">Дерево или металл</div>';
  html += `<div class="two-col">
    <div class="col"><div class="col-title">${wm.wood.title}</div><div class="col-text">${wm.wood.text}</div></div>
    <div class="col"><div class="col-title">${wm.metal.title}</div><div class="col-text">${wm.metal.text}</div></div>
  </div>`;
  html += `<div class="step-note">${wm.note}</div>`;
  html += '<div class="p-spacer"></div>';
  html += footerBlock();
  html += '</div></section>';
  return html;
}

function screenWeArePricier() {
  let html = '<section class="screen" id="my-dorozhe"><div class="p-pad">';
  html += headerBlock(null);
  html += '<div class="p-title small">Мы дороже. И вот за что.</div>';
  for (const [title, text] of DATA.pricier) {
    html += `<div class="pricier-point"><b>${title}</b> ${text}</div>`;
  }
  html += '<div class="p-spacer"></div>';
  html += footerBlock();
  html += '</div></section>';
  return html;
}

function buildAllScreens() {
  const parts = [];
  parts.push({id:'cover', html: screenCover()});
  parts.push({id:'tri-shaga', html: screenThreeSteps()});
  parts.push({id:'navigator', html: screenNavigator()});
  parts.push({id:'derevo-metall', html: screenWoodOrMetal()});
  parts.push({id:'my-dorozhe', html: screenWeArePricier()});
  for (const d of DATA.dividers) parts.push({id:`razdel-${d.accent}`, html: dividerScreen(d)});
  for (const fam of DATA.families) {
    parts.push({id:`fam-${fam.num}-visual`, html: familyVisual(fam)});
    parts.push({id:`fam-${fam.num}-data`, html: familyData(fam)});
  }
  return parts;
}

(function render() {
  let parts = buildAllScreens();
  const only = new URLSearchParams(location.search).get('only');
  if (only) parts = parts.filter(p => p.id === only);
  document.getElementById('screens').innerHTML = parts.map(p => p.html).join('');
})();

</script>
